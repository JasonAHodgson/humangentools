url: https://jasonahodgson.github.io/humangentools/
template:
  bootstrap: 5

reference:
- title: Datasets
  desc: >
    The bundled genotype datasets, and the vocabulary used by every
    `source_dataset` column and `dataset` argument in the package.
  contents:
  - get_dataset_info

- title: Sample and population metadata
  desc: >
    Look up populations and samples by canonical code, label, region, source
    dataset or age. Populations are keyed by a code that carries the genotype
    dataset, so a group genotyped by several projects stays separable, and
    coordinates are recorded separately for a group's origin and its sampling
    location.
  contents:
  - get_pop_info
  - get_sample_information

- title: SNP panels
  desc: >
    Browse and select SNP sets for the Axiom Human Origins array ascertainment
    panels. Panel membership is not exclusive, which matters for any comparison
    of diversity between populations.
  contents:
  - get_panel_information
  - get_axiom_snps

- title: Cross-referencing with dplaceR
  desc: >
    The hand-reviewed crosswalk linking populations to societies in dplaceR's
    D-PLACE data, for combined genetic and cross-cultural analyses.
  contents:
  - get_dplace_link
